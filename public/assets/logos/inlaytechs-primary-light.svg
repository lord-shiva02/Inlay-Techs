<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  
    <defs>
      <!-- Teal Metallic Gradients -->
      <linearGradient id="plight-teal-top-outer" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#2DD4BF"/>
        <stop offset="35%" stop-color="#14B8A6"/>
        <stop offset="70%" stop-color="#0D9488"/>
        <stop offset="100%" stop-color="#0F766E"/>
      </linearGradient>

      <linearGradient id="plight-teal-top-face" x1="0%" y1="0%" x2="100%" y2="80%">
        <stop offset="0%" stop-color="#5EEAD4"/>
        <stop offset="25%" stop-color="#2DD4BF"/>
        <stop offset="60%" stop-color="#14B8A6"/>
        <stop offset="100%" stop-color="#0F766E"/>
      </linearGradient>

      <linearGradient id="plight-teal-inner-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#0F766E"/>
        <stop offset="50%" stop-color="#0D9488"/>
        <stop offset="100%" stop-color="#042F2E"/>
      </linearGradient>

      <linearGradient id="plight-teal-bottom-face" x1="0%" y1="0%" x2="100%" y2="50%">
        <stop offset="0%" stop-color="#0F766E"/>
        <stop offset="40%" stop-color="#14B8A6"/>
        <stop offset="75%" stop-color="#2DD4BF"/>
        <stop offset="100%" stop-color="#0D9488"/>
      </linearGradient>

      <linearGradient id="plight-teal-bottom-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#042F2E"/>
        <stop offset="60%" stop-color="#0F766E"/>
        <stop offset="100%" stop-color="#14B8A6"/>
      </linearGradient>

      <!-- Bronze Metallic Gradients -->
      <linearGradient id="plight-bronze-outer" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FDE68A"/>
        <stop offset="20%" stop-color="#F59E0B"/>
        <stop offset="50%" stop-color="#CD7F32"/>
        <stop offset="80%" stop-color="#B45309"/>
        <stop offset="100%" stop-color="#78350F"/>
      </linearGradient>

      <linearGradient id="plight-bronze-top-facet" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#92400E"/>
        <stop offset="35%" stop-color="#CD7F32"/>
        <stop offset="70%" stop-color="#F59E0B"/>
        <stop offset="100%" stop-color="#FDE68A"/>
      </linearGradient>

      <linearGradient id="plight-bronze-inner" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#451A03"/>
        <stop offset="40%" stop-color="#78350F"/>
        <stop offset="80%" stop-color="#B45309"/>
        <stop offset="100%" stop-color="#CD7F32"/>
      </linearGradient>

      <!-- Specular Silver Rim Highlights -->
      <linearGradient id="plight-rim-silver" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
        <stop offset="50%" stop-color="#E0E0E0" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      </linearGradient>

      <linearGradient id="plight-gold-rim" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.9"/>
        <stop offset="60%" stop-color="#FBBF24" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#B45309" stop-opacity="0.1"/>
      </linearGradient>

      <!-- Drop Shadows & Ambient Glow -->
      <filter id="plight-ambient-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur"/>
        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
      </filter>

      <filter id="plight-soft-shadow" x="-25%" y="-20%" width="150%" height="150%">
        <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
      </filter>
    </defs>
    
  <!-- Background -->
  <rect width="920" height="280" rx="16" fill="#FFFFFF"/>

  <!-- Symbol -->
  <g transform="translate(40, 20) scale(0.75)">
    
    <g class="inlay-symbol-root" filter="url(#plight-soft-shadow)">
      <!-- 1. Lower Teal Anchor & Base Facet (Lower right background) -->
      <path d="M152 232 L206 270 L238 224 L238 186 L206 208 Z" 
            fill="url(#plight-teal-bottom-bevel)" />

      <!-- 2. Lower Teal Bottom Arm (Forms bottom right foundation) -->
      <path d="M152 232 L152 248 L206 286 L238 240 L238 224 L206 270 Z" 
            fill="url(#plight-teal-bottom-face)" />

      <!-- 3. Bronze Ribbon Inner Pass (Threading through loop) -->
      <path d="M136 142 L164 162 L152 216 L124 196 Z" 
            fill="url(#plight-bronze-inner)" />

      <!-- 4. Upper Teal Top Left Fold (Isometric top cap) -->
      <path d="M134 46 L162 26 L190 46 L162 66 Z" 
            fill="url(#plight-teal-top-face)" />

      <!-- 5. Upper Teal Left Vertical Bevel -->
      <path d="M134 46 L162 66 L162 92 L134 72 Z" 
            fill="url(#plight-teal-inner-bevel)" />

      <!-- 6. Upper Teal Long Outer Arm (Sweeps down-right to the peak) -->
      <path d="M162 26 L238 82 L238 108 L162 66 Z" 
            fill="url(#plight-teal-top-face)" />

      <!-- 7. Upper Teal Outer Bevel/Facet (Top-right down-angle) -->
      <path d="M238 82 L238 108 L206 132 L206 106 Z" 
            fill="url(#plight-teal-top-outer)" />

      <!-- 8. Upper Teal Inner Return Fold (Heading back to center) -->
      <path d="M206 106 L206 132 L162 164 L162 138 Z" 
            fill="url(#plight-teal-inner-bevel)" />

      <!-- 9. Bronze Ribbon Interlocking Loop (Main dynamic swoosh) -->
      <!-- Curves from center down-left and across the front to the lower-right vertex -->
      <path d="M162 138 L162 164 L118 196 L98 214 L98 238 L118 258 L152 248 L152 232 L118 242 L112 230 L118 210 L136 194 Z" 
            fill="url(#plight-bronze-outer)" />

      <!-- 10. Bronze Ribbon Front Facing Diagonal Wing (Main bronze face) -->
      <path d="M118 196 L152 144 L234 104 L206 132 L152 172 Z" 
            fill="url(#plight-bronze-top-facet)" />

      <!-- 11. Bronze Ribbon Lower Wrap (Completing the S-turn) -->
      <path d="M98 238 L118 258 L152 232 L206 208 L238 186 L206 204 L152 226 L118 238 Z" 
            fill="url(#plight-bronze-outer)" />

      <!-- 12. Bottom-Right Teal Cap & Corner Facet -->
      <path d="M238 108 L238 186 L206 208 L206 132 Z" 
            fill="url(#plight-teal-top-outer)" />

      <!-- Specular Highlight Overlays (Refined metallic bevel strokes) -->
      <path d="M134 46 L162 26 L238 82 L238 108" 
            stroke="url(#plight-rim-silver)" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85"/>
      <path d="M162 66 L238 108" 
            stroke="#5EEAD4" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7"/>
      <path d="M118 196 L152 144 L234 104" 
            stroke="url(#plight-gold-rim)" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.9"/>
      <path d="M98 214 L98 238 L118 258 L152 248" 
            stroke="#FDE68A" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.75"/>
      <path d="M152 248 L206 286 L238 240" 
            stroke="#2DD4BF" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    </g>
    
  </g>

  <!-- Wordmark for Light Canvas -->
  <g transform="translate(260, 158)">
    <text font-family="'Plus Jakarta Sans', 'Outfit', 'Inter', sans-serif" 
          font-size="62" 
          font-weight="800" 
          letter-spacing="7px" 
          fill="#0A0A0A">
      INLAY<tspan fill="#0D9488">TECHS</tspan>
    </text>
    <text y="34" 
          font-family="'Plus Jakarta Sans', 'Inter', sans-serif" 
          font-size="14" 
          font-weight="600" 
          letter-spacing="6px" 
          fill="#525252">
      NEXT-GEN ENTERPRISE SYSTEMS
    </text>
  </g>
</svg>